name: 'Check spelling'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      incremental_files_only:
        description: 'Check only incremental files'
        default: 'true'
        type: choice
        options: ['true', 'false']
        

permissions:
  contents: read

jobs:
  spellcheck: # run the action
    runs-on: ubuntu-latest
    steps:
      - uses: stone-payments/approved-actions/actions/checkout/v4@stable

      - name: Install Node
        uses: stone-payments/approved-actions/actions/setup-node/v4@stable
        with:
          node-version: 18
      
      - run: |
          cd .cspell 
          npm install

      - uses: streetsidesoftware/cspell-action@v6 # approved-actions: nao encontrado no catalogo — revisao manual necessaria
        with:
          incremental_files_only: ${{ github.event.inputs.incremental_files_only }}
          config: "./cspell.json"
          files: |
            **/*.{md,txt,json}
            LICENSE